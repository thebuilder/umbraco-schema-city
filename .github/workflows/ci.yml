name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        umbraco: [17.6.2, 18.1.1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/SchemaCity/Client/package-lock.json

      - run: npm ci
        working-directory: src/SchemaCity/Client

      - run: npm run build
        working-directory: src/SchemaCity/Client

      - run: dotnet build SchemaCity.sln -c Release -p:UmbracoVersion=${{ matrix.umbraco }}

      - run: dotnet test SchemaCity.sln -c Release --no-build

      # Compiling against both majors is not enough. Umbraco discovers composers and controllers
      # by scanning types at boot, so a missing base type only shows up when the site runs.
      - name: boot the site and check it serves
        working-directory: src/SchemaCity.Site
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:61801
        run: |
          dotnet run --no-build --no-launch-profile -c Release -p:UmbracoVersion=${{ matrix.umbraco }} &
          code() { curl -so /dev/null -w '%{http_code}' "http://localhost:61801$1"; }
          # /umbraco answers during the unattended install, but App_Plugins is only served once
          # Umbraco reaches the Run level, so wait on the manifest rather than on the backoffice.
          for _ in $(seq 60); do
            [ "$(code /App_Plugins/SchemaCity/umbraco-package.json)" = 200 ] && break
            sleep 2
          done
          test "$(code /App_Plugins/SchemaCity/umbraco-package.json)" = 200
          test "$(code /umbraco)" = 200
          test "$(code /umbraco/management/api/v1/schema-city/graph)" = 401
          pkill -f SchemaCity.Site
