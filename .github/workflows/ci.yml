name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        umbraco: [17.6.2, 18.1.1]
    steps:
      # Full history, because fallow's audit gate diffs the client against the base commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/SchemaCity/Client/package-lock.json

      - run: npm ci
        working-directory: src/SchemaCity/Client

      - run: npm run lint
        working-directory: src/SchemaCity/Client

      # Only on a pull request: the gate compares the changed files against the base,
      # and a push has nothing to compare them to.
      - name: audit the changed client code
        if: github.event_name == 'pull_request'
        working-directory: src/SchemaCity/Client
        run: npm run fallow -- --base '${{ github.event.pull_request.base.sha }}' --format github-annotations

      - run: npm run build
        working-directory: src/SchemaCity/Client

      # npm ran above, so the library's own client build target has nothing to do.
      - run: dotnet build SchemaCity.sln -c Release -p:UmbracoVersion=${{ matrix.umbraco }} -p:SkipClientBuild=true

      - run: dotnet test SchemaCity.sln -c Release --no-build

      # One package covers both majors, so packing once is enough. --no-build reuses the Release
      # output above, static web assets included.
      - name: pack and check the package
        if: matrix.umbraco == '17.6.2'
        run: |
          dotnet pack src/SchemaCity/SchemaCity.csproj -c Release --no-build -o pack -p:SkipClientBuild=true
          nupkg=$(echo pack/*.nupkg)
          test -f "$nupkg"
          list=$(unzip -l "$nupkg")
          grep -q staticwebassets/App_Plugins/SchemaCity/workspace.js <<<"$list"
          test -z "$(grep '\.map' <<<"$list")"
          test "$(wc -c < "$nupkg")" -lt 1048576

      # Compiling against both majors is not enough. Umbraco discovers composers and controllers
      # by scanning types at boot, so a missing base type only shows up when the site runs.
      - name: boot the site and check it serves
        working-directory: src/SchemaCity.Site
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:61801
        run: |
          dotnet run --no-build --no-launch-profile -c Release -p:UmbracoVersion=${{ matrix.umbraco }} &
          code() { curl -so /dev/null -w '%{http_code}' "http://localhost:61801$1"; }
          # /umbraco answers during the unattended install, but App_Plugins is only served once
          # Umbraco reaches the Run level, so wait on the manifest rather than on the backoffice.
          for _ in $(seq 60); do
            [ "$(code /App_Plugins/SchemaCity/umbraco-package.json)" = 200 ] && break
            sleep 2
          done
          test "$(code /App_Plugins/SchemaCity/umbraco-package.json)" = 200
          test "$(code /umbraco)" = 200
          test "$(code /umbraco/management/api/v1/schema-city/graph)" = 401
          test "$(code /umbraco/management/api/v1/schema-city/usage)" = 401
          pkill -f SchemaCity.Site || true
