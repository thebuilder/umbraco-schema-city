<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Schema City demo</title>
    <style>
    :root {
      font-family: ui-monospace, monospace;
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      color: #e9f6f1;
      background: #05090a;
    }

    /* The sample picker, which the app's footer holds in its host slot. */
    .demo-picker {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      font-size: 0.625rem;
      color: #87a39d;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .demo-picker select {
      padding: 0.2rem 0.4rem;
      font: inherit;
      font-size: 0.6875rem;
      color: #d9ffef;
      text-transform: none;
      letter-spacing: normal;
      cursor: pointer;
      background-color: #0b1515;
      border: 1px solid rgb(132 255 224 / 0.38);
      border-radius: 0;
    }

    .demo-picker select:hover {
      border-color: #86fadd;
    }

    .demo-picker select:focus-visible {
      outline: 2px solid #d9ffef;
      outline-offset: 2px;
    }
    </style>
  </head>
  <body style="margin: 0; height: 100vh; display: flex; flex-direction: column">
    <div id="app" style="flex: 1; min-height: 0"></div>
    <script src="./main.tsx" type="module"></script>
  </body>
</html>
